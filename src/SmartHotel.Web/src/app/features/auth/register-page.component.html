<section class="auth-page">
  <h1>Register</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="register-email">Email</label>
      <input
        id="register-email"
        data-testid="register-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        required
      />
    </div>

    <div class="field">
      <label for="register-password">Password</label>
      <input
        id="register-password"
        data-testid="register-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="field">
      <label for="register-full-name">Full name</label>
      <input
        id="register-full-name"
        data-testid="register-full-name"
        type="text"
        formControlName="fullName"
        autocomplete="name"
        required
      />
    </div>

    <app-error-message [error]="error()"></app-error-message>

    <button type="submit" data-testid="register-submit" [disabled]="pending()">Create account</button>
  </form>

  <p><a routerLink="/login" data-testid="login-link">Already registered? Log in</a></p>
</section>
