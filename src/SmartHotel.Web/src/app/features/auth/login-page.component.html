<!-- A guest who is already signed in, as after Back to an earlier login
     entry, is sent on at once, so the form never shows; only the register
     page's fresh hand-off shows it to them, for the account just created, and
     a move on that does not reach the next page, with its inline error. -->
<section *ngIf="!redirecting()" class="auth-page">
  <h1 #heading tabindex="-1">Log in</h1>

  <!-- The visible notice is in the page's first frame, so it never pushes the
       form down. Assistive technology skips it and hears the same text once,
       from the live region below. -->
  <p *ngIf="notice() as text" class="notice" aria-hidden="true" data-testid="login-notice">{{ text }}</p>

  <!-- Always mounted and visually hidden: a live region inserted with its text
       already in it may go unannounced, so the text is written into it after
       it has rendered empty. -->
  <p class="visually-hidden" role="status" aria-live="polite" data-testid="login-announcement">{{ announcement() }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="login-email">Email</label>
      <input
        #emailInput
        id="login-email"
        data-testid="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        required
        [attr.aria-invalid]="fieldErrors().has('email') ? 'true' : null"
        [attr.aria-describedby]="fieldErrors().get('email') ?? null"
      />
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        #passwordInput
        id="login-password"
        data-testid="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
        [attr.aria-invalid]="fieldErrors().has('password') ? 'true' : null"
        [attr.aria-describedby]="fieldErrors().get('password') ?? null"
      />
    </div>

    <app-error-message [error]="error()" [fieldErrorIdPrefix]="errorIdPrefix"></app-error-message>

    <button #submitButton type="submit" data-testid="login-submit" [disabled]="pending()">Log in</button>
  </form>

  <p><a routerLink="/register" [state]="registerLinkState()" data-testid="register-link">Create an account</a></p>
</section>
