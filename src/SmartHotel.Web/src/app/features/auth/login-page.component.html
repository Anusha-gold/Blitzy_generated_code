<section class="auth-page">
  <h1>Log in</h1>

  <p *ngIf="notice() as message" class="notice" role="status" data-testid="login-notice">{{ message }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        data-testid="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        required
      />
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        data-testid="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />
    </div>

    <app-error-message [error]="error()"></app-error-message>

    <button type="submit" data-testid="login-submit" [disabled]="pending()">Log in</button>
  </form>

  <p><a routerLink="/register" data-testid="register-link">Create an account</a></p>
</section>
