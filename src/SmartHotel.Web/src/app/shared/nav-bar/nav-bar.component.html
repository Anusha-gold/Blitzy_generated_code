<header class="nav-bar">
  <nav aria-label="Main">
    <a class="brand" routerLink="/search" data-testid="nav-brand">SmartHotel</a>
    <a
      routerLink="/search"
      routerLinkActive="current"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="currentPageMatch"
      data-testid="nav-search"
    >Search</a>
    <a
      routerLink="/bookings"
      routerLinkActive="current"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="currentPageMatch"
      data-testid="nav-bookings"
    >My bookings</a>
    <div class="account">
      <ng-container *ngIf="auth.session() as s; else signedOut">
        <span class="email" data-testid="nav-email">{{ s.email }}</span>
        <button
          #logOutButton
          type="button"
          data-testid="nav-logout"
          (click)="auth.logout()"
          (focus)="logOutFocused()"
          (blur)="logOutBlurred(logOutButton)"
        >Log out</button>
      </ng-container>
      <ng-template #signedOut>
        <a
          #logInLink
          routerLink="/login"
          routerLinkActive="current"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="currentPageMatch"
          data-testid="nav-login"
        >Log in</a>
        <a
          routerLink="/register"
          routerLinkActive="current"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="currentPageMatch"
          data-testid="nav-register"
        >Register</a>
      </ng-template>
    </div>
  </nav>
</header>
